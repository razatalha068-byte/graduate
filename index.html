
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Congratulations Dr. Nataliya</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="stage">

        <div class="poster" id="poster">

            <img
                src="graduation.png"
                alt="Dr. Nataliya Graduation Celebration"
                class="main-image"
            >

            <div class="light-effect"></div>

            <div class="image-sparkles" id="sparkles"></div>

            <!-- Interactive button over original image -->
            <button
                class="celebrate-button"
                id="celebrate"
                aria-label="Celebrate this moment"
            ></button>

        </div>

    </div>

    <div class="message" id="message">
        ✨ Congratulations Dr. Nataliya! ❤️
    </div>

    <script src="script.js"></script>

</body>
</html>
